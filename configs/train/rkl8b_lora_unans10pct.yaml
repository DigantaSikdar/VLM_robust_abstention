# LoRA RKL with the frozen Qwen3-VL-8B teacher (teacher on its own GPU), 1000 steps, system prompt (think_answer), trained on severity-4 GQA with 10% VizWiz-train
# unanswerable questions (gold 'unanswerable'; 1,101 of 11,010; ~803 seen in 8,000). Every training question
# carries the VizWiz note. Otherwise identical to t8b_s4_rkl_sys (frozen config of that run).
method: caad
seed: 0
deterministic: false
log_level: info
output_dir: /gscratch/dsikdar/outputs/rkl8b_lora_unans10pct
model:
  name: Qwen/Qwen3-VL-4B-Instruct
  dtype: bfloat16
  attn_implementation: sdpa
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false
  max_pixels: null
teacher:
  name: Qwen/Qwen3-VL-8B-Instruct
  dtype: bfloat16
  attn_implementation: sdpa
  device: cuda:1
lora:
  enabled: true
  r: 16
  alpha: 32
  dropout: 0.0
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
caad:
  loss: eopd
  eopd:
    base: rkl
    topk: 16
    clip_eps: 0.2
    diagnostics: true
  fkl_gate: low_quantile
  fkl_tau: 0.8
  fkl_quantile: 0.0
  fkl_tau_low: 0.2
  min_tokens_for_quantile: 24
  jsd_beta: 0.5
  lambda_l2: 0.0
  anchor_beta: 0.0
  ema_decay: 0.999
  chunk_size: 64
train:
  learning_rate: 1.0e-05
  lr_scheduler_type: cosine
  warmup_ratio: 0.1
  max_grad_norm: 1.0
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  max_steps: 1000
  num_train_epochs: 1
  ema_every: 1
  save_steps: 500
  save_total_limit: 0
  logging_steps: 1
  logging_first_step: true
rollout:
  backend: vllm
  sync_mode: lora
  sync_every: 10
  num_generations: 2
  temperature: 1.0
  top_p: 1.0
  max_completion_length: 512
  server:
    host: 127.0.0.1
    port: 8000
    gpu: 0
    gpu_mem_util: 0.85
    max_lora_rank: 16
    startup_timeout: 900
    adapter_dir: /gscratch/dsikdar/outputs/rkl8b_lora_unans10pct/_vllm_adapters
eval:
  do_eval: false
  eval_steps: 0
data:
  manifest: /gscratch/dsikdar/caad_data/gqa_s4_vizwiz_unans10pct/manifest.jsonl
  image_root: null
  prompt_format: think_answer
  system_prompt: null
wandb:
  enabled: true
  project: caad
  entity: null
  run_name: rkl8b_lora_unans10pct
  tags:
  - rkl
  - 8b-teacher
  - lora-r16
  - system-prompt
  - 1000steps
  - vizwiz-note-all
  - unans10pct
  log_completions: true
  rollout_table_every: 50
  config: null
hub:
  enabled: false
  model_id: ''
  private: true
  push_every_n_steps: 0
