# =============================================================================
# GRPO baseline, FULL fine-tuning (no LoRA), InternVL's NATIVE VQA prompt —
# InternVL3.5-4B (HF format) answers from the CORRUPTED image only (no teacher,
# no clean image; KL 0.04 to the frozen starting policy); 8 rollouts per question, reward = GQA exact
# match. format_reward 0: the native prompt asks for a bare short answer, so
# there are no <answer> tags to reward. Prompt = no system prompt,
# "{question}\nAnswer the question using a single word or phrase."
# (prompt_format internvl_vqa), the same as the InternVL RKL run it is compared
# with. Guard rails as in fullft_grpo_qwen3vl4b_sys_1ep_v2 (strict reward, KL 0.04;
# no stop string: plain answers end at EOS). One full epoch of severity-4 GQA 30k (3750 optimizer steps of 8
# questions), lr 1e-6, BF16AdamW.
#   sbatch -p mb-h100 --gres=gpu:h100:2 scripts/slurm/train_fullft_2gpu.sbatch \
#     configs/train/fullft_grpo_internvl35_4b_vqa_1ep.yaml
# =============================================================================
method: grpo
grpo:
  format_reward: 0.0               # no tags under the native prompt
  clip_eps: 0.2
  std_normalize: true
  strict_reward: true              # answer counts only if it is one short line (<= 8 words)
  answer_format: plain
  max_answer_words: 8
  kl_beta: 0.04                    # per-token KL (k3) to the frozen starting policy
  ref_device: cuda:1               # reference model sits on the vLLM GPU
seed: 0
deterministic: false
log_level: info

output_dir: /gscratch/dsikdar/outputs/fullft_internvl35_grpo_vqa_1ep

model:
  name: OpenGVLab/InternVL3_5-4B-HF
  dtype: bfloat16
  attn_implementation: sdpa
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false
  max_pixels: null

lora:
  enabled: false                   # full fine-tuning

caad:
  chunk_size: 64

train:
  optimizer: bf16_adamw            # fp32 grads + moments, stochastic rounding into bf16 weights
  learning_rate: 1.0e-6            # full-FT LR (LoRA runs used 1e-5)
  weight_decay: 0.01               # torch AdamW default, as in the LoRA runs
  lr_scheduler_type: cosine
  warmup_ratio: 0.1
  max_grad_norm: 1.0
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  max_steps: 0                     # 0 -> num_train_epochs over the dataset
  num_train_epochs: 1              # 30000 / 8 = 3750 optimizer steps
  ema_every: 1
  save_steps: 1250
  save_total_limit: 0
  logging_steps: 1
  logging_first_step: true

rollout:
  backend: vllm
  sync_mode: full
  sync_every: 10                   # push full weights to vLLM every 10 optimizer steps
  num_generations: 8
  temperature: 1.0
  top_p: 1.0
  max_completion_length: 512       # answers are ~3 tokens; this only caps runaways
  server:
    host: 127.0.0.1
    port: 8000                     # the job script overrides this per job
    gpu: 0
    startup_timeout: 900
    weights_dir: null              # the job script sets a node-local dir

eval:
  do_eval: false
  eval_steps: 0

data:
  manifest: /gscratch/dsikdar/caad_data/gqa_train_30k_s4/manifest.jsonl
  image_root: null
  prompt_format: internvl_vqa      # InternVL3.5 native short-answer VQA prompt (no system prompt)
  system_prompt: null

wandb:
  enabled: true
  project: caad
  entity: null
  run_name: fullft_internvl35_grpo_vqa_1ep
  tags: [full-ft, grpo, strict-reward, kl0.04, internvl3.5-4b, gqa30k, severity4, 1epoch, native-vqa-prompt]
  log_completions: true
  rollout_table_every: 50
  config: null

hub:
  enabled: false
  model_id: ""
  private: true
  push_every_n_steps: 0
