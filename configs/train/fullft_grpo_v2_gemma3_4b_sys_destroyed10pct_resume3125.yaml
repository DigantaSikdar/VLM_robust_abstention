# =============================================================================
# 10% unanswerable retraining for Gemma 3 4B: identical to fullft_grpo_v2_gemma3_4b_sys_1ep.yaml except the data
# (30k severity-4 GQA + 3,334 GQA questions with a DESTROYED image labelled 'unanswerable';
# every question carries the VizWiz note) and max_steps 3750 (same compute as the 0% run),
# as in fullft_grpo_v2_internvl35_4b_sys_destroyed10pct.yaml. Gemma is slower (~42 s/step), hence 3 phases.
# PHASE 3 of 3: resumes phase 2 (final = step 3125) on the unseen remainder, to step 3750.
# =============================================================================
# GRPO baseline, FULL fine-tuning (no LoRA) — InternVL3.5-4B (HF format) answers from
# the CORRUPTED image only (no teacher, no clean image, no KL penalty); 8
# rollouts per question, reward = GQA exact match + 0.1 for <answer> tags.
# System prompt (think_answer). One full epoch of severity-4 GQA 30k (3750
# optimizer steps of 8 questions). Same recipe as grpo_s4_sys except: full FT
# (all weights incl. vision tower), lr 1e-6, 1 epoch, BF16AdamW.
#   sbatch -p mb-h100 --gres=gpu:h100:2 scripts/slurm/train_fullft_2gpu.sbatch \
#     configs/train/fullft_grpo_internvl35_4b_sys_1ep.yaml
# v2 (Oct 26): guard rails of fullft_grpo_qwen3vl4b_sys_1ep_v2 / lora_internvl35_4b_grpo_500 (both v1
# full-FT Qwen runs collapsed into answer+junk): strict reward, rollouts stop at </answer>, KL 0.04 to
# the frozen starting policy.
#   sbatch -J ff-ivl-grpo scripts/slurm/train_fullft_2gpu_ai4wy.sbatch \
#     configs/train/fullft_grpo_v2_internvl35_4b_sys_1ep.yaml
# =============================================================================
method: grpo
grpo:
  format_reward: 0.1
  clip_eps: 0.2
  std_normalize: true
  strict_reward: true              # answer counts only inside one <answer> block that ends the response
  answer_format: tags
  ref_model: google/gemma-3-4b-it   # KL reference stays the ORIGINAL starting policy
  kl_beta: 0.04                    # per-token KL (k3) to the frozen starting policy
  ref_device: cuda:1               # reference model sits on the vLLM GPU
seed: 0
deterministic: false
log_level: info

output_dir: /gscratch/dsikdar/outputs/fullft_gemma3_4b_grpo_v2_sys_destroyed10pct_resume3125

model:
  name: /gscratch/dsikdar/outputs/fullft_gemma3_4b_grpo_v2_sys_destroyed10pct_resume1750/checkpoints/final
  dtype: bfloat16
  attn_implementation: sdpa
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false
  max_pixels: null

lora:
  enabled: false                   # full fine-tuning

caad:
  chunk_size: 64

train:
  optimizer: bf16_adamw            # fp32 grads + moments, stochastic rounding into bf16 weights
  learning_rate: 1.0e-6            # full-FT LR (LoRA runs used 1e-5)
  weight_decay: 0.01               # torch AdamW default, as in the LoRA runs
  lr_scheduler_type: cosine
  warmup_ratio: 0.1
  max_grad_norm: 1.0
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  resume_step: 3125               # continue from model.name
  max_steps: 3750                  # same compute as the 0% run (30,000 of the 33,334 samples)
  num_train_epochs: 1              # 30000 / 8 = 3750 optimizer steps
  ema_every: 1
  save_steps: 1250
  save_total_limit: 0
  logging_steps: 1
  logging_first_step: true

rollout:
  backend: vllm
  sync_mode: full
  sync_every: 10                   # push full weights to vLLM every 10 optimizer steps
  num_generations: 8
  temperature: 1.0
  top_p: 1.0
  max_completion_length: 512
  stop: ["</answer>"]              # rollouts end at the answer
  server:
    host: 127.0.0.1
    port: 8000                     # the job script overrides this per job
    gpu: 0
    startup_timeout: 900
    weights_dir: null              # the job script sets a node-local dir

eval:
  do_eval: false
  eval_steps: 0

data:
  manifest: /gscratch/dsikdar/caad_data/gqa_s4_destroyed10pct/manifest.jsonl
  image_root: null
  prompt_format: think_answer
  system_prompt: null

wandb:
  enabled: true
  project: caad
  entity: null
  run_name: fullft_gemma3_4b_grpo_v2_sys_destroyed10pct_resume3125
  tags: [full-ft, grpo, strict-reward, kl0.04, stop-answer, gemma-3-4b, gqa30k-destroyed10pct, severity4, 1epoch, system-prompt]
  log_completions: true
  rollout_table_every: 50
  config: null

hub:
  enabled: false
  model_id: ""
  private: true
  push_every_n_steps: 0
