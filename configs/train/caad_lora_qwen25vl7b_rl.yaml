# =============================================================================
# CAAD — full multi-GPU training, Qwen2.5-VL-7B, DEDICATED vLLM SERVER topology.
#   GPU 0       = vLLM rollout server (scripts/vllm_serve.sh, started by train_rl.sh)
#   GPUs 1..N-1 = training (accelerate + ZeRO)
#
# Train mode is config-driven:
#   LoRA + ZeRO-2 (this file): lora.enabled=true, sync_mode=lora, ACC=zero2.yaml
#   Full-FT + ZeRO-3         : set lora.enabled=false, sync_mode=full, ACC=zero3.yaml
#                              (full-weight vLLM sync is a seam — see rollout.py)
#
#   CFG=configs/train/caad_lora_qwen25vl7b_rl_rl.yaml ACC=configs/accelerate/zero2.yaml \
#     NUM_GPUS=4 bash scripts/train_rl.sh data.manifest=data/img_train_manifest.jsonl
#
# IMPORTANT: num_processes in the ACC config must equal (total GPUs - 1), since
# GPU 0 is the server.
# =============================================================================

method: caad                 # selects the trainer (see TRAINERS in caad/train.py)
seed: 7
deterministic: false
log_level: info

# where THIS run's checkpoints / logs / results / frozen-config are written.
# Point it at scratch on a cluster, e.g.
#   /capstor/scratch/cscs/ahsan600613/outputs/caad_lora_qwen25vl7b_rl
output_dir: outputs/caad_lora_qwen25vl7b_rl

# --- model ---
model:
  name: Qwen/Qwen2.5-VL-7B-Instruct
  dtype: bfloat16                  # bf16 training (also set in the accelerate config)
  attn_implementation: sdpa        # GH200: SDPA = FlashAttention-2 (no flash-attn pkg)
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false
  max_pixels: 401408               # ~633*633 -> <=512 visual tokens per image

# --- LoRA (student = trainable adapter, teacher = its EMA) ---
lora:
  enabled: true
  r: 16
  alpha: 32
  dropout: 0.0
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj",
                   "gate_proj", "up_proj", "down_proj"]

# --- CAAD method knobs ---
caad:
  fkl_quantile: 0.10               # bottom-q teacher-entropy tokens use forward-KL, rest JSD
  min_tokens_for_quantile: 24      # short rollouts fall back to the batch-level quantile
  jsd_beta: 0.5
  lambda_l2: 0.5                   # weight on the clean<-corrupted visual-L2 alignment term
  anchor_beta: 0.05                # KL(pi || pi_init) weight — CAAD's reference-KL (TRL's `beta` role)
  ema_decay: 0.999                 # teacher EMA decay
  chunk_size: 64                   # sequence-axis chunk for the divergence math (OOM guard)

# --- training (step counts below are OPTIMIZER steps, not samples) ---
train:
  # optimizer
  learning_rate: 1.0e-5
  lr_scheduler_type: cosine
  warmup_ratio: 0.1
  max_grad_norm: 1.0
  # batch (effective batch formula in the header)
  per_device_train_batch_size: 1   # accumulate sequentially, bs=1 per device
  gradient_accumulation_steps: 8
  # schedule — use max_steps OR (set max_steps:0 and use num_train_epochs)
  max_steps: 2000
  num_train_epochs: 1
  ema_every: 1                     # EMA-update the teacher every N optimizer steps
  save_steps: 200
  save_total_limit: 10
  # logging
  logging_steps: 10
  logging_first_step: true

# --- rollout (sampling of student completions) ---
rollout:
  backend: vllm
  sync_mode: auto                  # auto -> lora if lora.enabled else full
  sync_every: 25                   # push student weights to the server every N opt steps
  num_generations: 4               # student completions sampled per (image, question)
  temperature: 1.0
  top_p: 1.0
  max_completion_length: 512
  server:
    host: 127.0.0.1
    port: 8000
    gpu: 0
    gpu_mem_util: 0.85
    max_lora_rank: 16
    startup_timeout: 600
    adapter_dir: outputs/caad_lora_qwen25vl7b_rl/_vllm_adapters

# --- in-training eval (off by default; the standalone caad.eval harness is the
#     main path — see configs/eval/. do_eval needs an injected evaluator seam) ---
eval:
  do_eval: false
  eval_steps: 0
  manifest: data/img_eval_manifest.jsonl
  samples: 200

# --- data ---
data:
  manifest: data/img_train_manifest.jsonl
  image_root: null                 # prefix for relative clean_image / corrupted_image paths
  system_prompt: "You are a careful visual question-answering assistant. Answer with the option letter."

# --- logging / W&B ---
wandb:
  enabled: true
  project: caad
  run_name: caad-lora-7b-rl      # explicit W&B run name (else falls back to output_dir name)
  log_completions: false                 # log a sample rollout text per logging step
  config: null

# --- HF hub push (fully config-controlled; in-training push when enabled) ---
hub:
  enabled: false                   # set true to push checkpoints during training
  model_id: ""                     # e.g. user/caad-qwen25vl7b
  private: true
  push_every_n_steps: 200
