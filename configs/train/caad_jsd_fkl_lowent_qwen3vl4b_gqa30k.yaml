# =============================================================================
# CAAD, EOPD-style loss — Qwen3-VL-4B-Instruct, LoRA r16, GQA train 30k (sev 1)
# Identical to caad_jsd_qwen3vl4b_gqa30k.yaml except the loss:
#   student: corrupted image (trainable LoRA adapter)
#   teacher: clean image, EMA of the student adapter
#   loss (per rollout token, EOPD structure — Jin et al. 2026 Eq. 9-10 — with
#   JSD in place of EOPD's reverse KL):
#     JSD_0.5(student, teacher) over the full vocabulary on EVERY token
#     + top-16 forward KL ADDED on the 10% LOWEST-teacher-entropy tokens of each
#       rollout (EOPD adds it on the high-entropy tokens instead)
#     token-mean over the optimizer step. Visual L2 and anchor KL OFF.
#   rollouts: 2 per question from a dedicated vLLM server (GPU 0) that
#            hot-loads the student adapter; training on GPU 1.
# 1 epoch = 30,000 questions / (1 x 8 accumulation) = 3,750 optimizer steps;
# each step sees 8 questions x 2 rollouts = 16 completions.
#   sbatch -p <gpu partition> scripts/slurm/train_caad_2gpu.sbatch \
#     configs/train/caad_jsd_fkl_lowent_qwen3vl4b_gqa30k.yaml
# =============================================================================

method: caad
seed: 0
deterministic: false
log_level: info

output_dir: /gscratch/dsikdar/outputs/caad_jsd_fkl_lowent_qwen3vl4b_gqa30k

model:
  name: Qwen/Qwen3-VL-4B-Instruct
  dtype: bfloat16
  attn_implementation: sdpa
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false
  max_pixels: null                 # processor default, same as the TextVQA-C / GQA-C eval

lora:                              # student adapter (trainable) + teacher adapter (EMA)
  enabled: true
  r: 16
  alpha: 32
  dropout: 0.0
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj",
                   "gate_proj", "up_proj", "down_proj"]   # language model only

caad:
  loss: eopd                       # jsd | eopd
  eopd:
    base: jsd                      # base term on every token: jsd | rkl (EOPD's clipped reverse KL)
    topk: 16                       # forward KL over the teacher's top-16 (renormalized)
    clip_eps: 0.2                  # only used by base: rkl
    diagnostics: true              # also log forward KL on low-10% / high-10% / H>0.8 / all tokens
  fkl_gate: low_quantile           # low_quantile | high_quantile | high_threshold
  fkl_quantile: 0.10               # forward KL added on the lowest-entropy 10% of each rollout
  min_tokens_for_quantile: 24
  jsd_beta: 0.5                    # JSD mixture weight for the base term
  lambda_l2: 0.0                   # visual L2 OFF
  anchor_beta: 0.0                 # anchor KL OFF
  ema_decay: 0.999                 # teacher = EMA of student, updated every optimizer step
  chunk_size: 64

train:
  learning_rate: 1.0e-5
  lr_scheduler_type: cosine
  warmup_ratio: 0.1
  max_grad_norm: 1.0
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  max_steps: 0                     # 0 -> use num_train_epochs
  num_train_epochs: 1
  ema_every: 1
  save_steps: 250
  save_total_limit: 5
  logging_steps: 1
  logging_first_step: true

rollout:
  backend: vllm
  sync_mode: lora
  sync_every: 10                   # push the student adapter to vLLM every 10 optimizer steps
  num_generations: 2
  temperature: 1.0
  top_p: 1.0
  max_completion_length: 512
  server:
    host: 127.0.0.1
    port: 8000                     # the job script overrides this per job
    gpu: 0
    gpu_mem_util: 0.85
    max_lora_rank: 16
    startup_timeout: 900
    adapter_dir: /gscratch/dsikdar/outputs/caad_jsd_fkl_lowent_qwen3vl4b_gqa30k/_vllm_adapters

eval:
  do_eval: false
  eval_steps: 0

data:
  manifest: /gscratch/dsikdar/caad_data/gqa_train_30k/manifest.jsonl
  image_root: null
  prompt_format: inline            # same prompt as the evaluation (reason, then <answer>)
  system_prompt: null

wandb:
  enabled: true
  project: caad
  entity: null
  run_name: caad-jsd-fkl-lowent10-qwen3vl4b-gqa30k-s1
  tags: [eopd-structure, jsd-base, fkl-low-entropy-10pct, qwen3-vl-4b, lora-r16, gqa30k, severity1]
  log_completions: true
  rollout_table_every: 50          # W&B table of sample rollouts (with images) every 50 steps
  config: null                     # null -> log the full resolved recipe

hub:
  enabled: false
  model_id: ""
  private: true
  push_every_n_steps: 0
